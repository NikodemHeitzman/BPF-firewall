name: DevSecOps BPF-Firewall CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable toolchain (Control Plane)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nightly toolchain (Data Plane eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run Clippy (Control Plane)
        run: cargo clippy --workspace --exclude firewall-ebpf -- -D warnings

      - name: Build User Space (Control Plane)
        run: cargo build --workspace --exclude firewall-ebpf

      - name: Build Kernel Space (Data Plane)
        run: cargo +nightly build -p firewall-ebpf --target bpfel-unknown-none -Z build-std=core --release